name: ledgerline

services:
  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      # Local demo only: no TLS or auth, and the port is bound to localhost.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Loads the payments once; re-running skips months that are already complete.
  seeder:
    build: { context: ., target: seeder }
    command: ["--count", "${SEED_COUNT:-2000000}"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: api }
    environment:
      Elasticsearch__Url: http://elasticsearch:9200
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      # The runtime image has no curl; bash can open the TCP connection itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  esdata:
